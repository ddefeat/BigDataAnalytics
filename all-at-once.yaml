# Docker Compose for All-At-Once Code Clone Detection

version: "3.8"
services:
  clone-detector:
    image: cljdetector
    command: clear
    depends_on:
      dbstorage:
        condition: service_healthy
    ports:
      - 8080:3000
    volumes:
      - qc-volume:/QualitasCorpus
    environment:
      DBHOST: dbstorage
      SOURCEDIRtest: "/usr/src/app/test/data"
      SOURCEDIReclipse: "/QualitasCorpus/QualitasCorpus-20130901r/Systems/eclipse_SDK"
      SOURCEDIR: "/QualitasCorpus"
      CHUNKSIZE: 20

  monitor-tool:
    image: monitortool
    depends_on:
      dbstorage:
        condition: service_healthy
    ports:
      - 8081:8000
    environment:
      DBHOST: dbstorage
      INTERVAL: 5

  dbstorage:
    image: mongo
    restart: always
    command: --quiet --syslog
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - dbstorage:/data/db
      - dbconfig:/data/configdb
    
volumes:
  dbstorage:
  dbconfig:
  qc-volume:
    external: true
    
